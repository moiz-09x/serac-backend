[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.14.1",
    "anthropic>=0.107.1",
    "arq>=0.28.0",
    "fastapi>=0.136.3",
    "fastembed>=0.8.0",
    "greenlet>=3.5.1",
    "httpx>=0.28.1",
    "langchain>=1.0",
    "langchain-openai>=0.3.0",
    "langfuse>=3.0",
    "langgraph>=1.2.4",
    "neo4j>=6.2.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "redis>=5.3.1",
    "slack-bolt[async]>=1.28.0",
    "alembic>=1.13.0",
    "cryptography>=42.0.0",
    "sqlalchemy>=2.0.50",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "ruff>=0.9.0",
    "pre-commit>=4.0.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long — handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
